<?xml version="1.0" encoding="UTF-8"?>
<!--
  OmniNeuro logo (placeholder).
  Abstract neural-network mark: a central node with radiating synaptic
  connections. Swap this file with the official brand asset when available.
  Uses a purple -> pink -> cyan gradient so it reads on light and dark backgrounds.
-->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OmniNeuro logo">
  <defs>
    <linearGradient id="omni-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Connective paths (synapses) -->
  <g stroke="url(#omni-grad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="10"/>
    <line x1="32" y1="32" x2="51" y2="21"/>
    <line x1="32" y1="32" x2="51" y2="43"/>
    <line x1="32" y1="32" x2="32" y2="54"/>
    <line x1="32" y1="32" x2="13" y2="43"/>
    <line x1="32" y1="32" x2="13" y2="21"/>
  </g>

  <!-- Outer nodes (neurons) -->
  <g fill="url(#omni-grad)">
    <circle cx="32" cy="10" r="5"/>
    <circle cx="51" cy="21" r="5"/>
    <circle cx="51" cy="43" r="5"/>
    <circle cx="32" cy="54" r="5"/>
    <circle cx="13" cy="43" r="5"/>
    <circle cx="13" cy="21" r="5"/>
  </g>

  <!-- Central node -->
  <circle cx="32" cy="32" r="8" fill="#1E3A8A"/>
  <circle cx="32" cy="32" r="8" fill="url(#omni-grad)" fill-opacity="0.35"/>
</svg>
